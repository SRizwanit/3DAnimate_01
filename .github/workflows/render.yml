# .github/workflows/render.yml — ধাপ ৮: GitHub Actions-এ অটো রেন্ডার (আপনার ডিভাইস লাগবে না)
#
# কখন চলে:
#   • repo-তে push করলে (শুধু .md ফাইল বদলালে চলে না)
#   • হাতে চালালে: Actions ট্যাব → "Render Story Video" → Run workflow
#
# কী করে: HD (1080×1920) ও 4K (2160×3840) আলাদা দুটি জবে একসাথে রেন্ডার করে, শেষে MP4 আর্টিফ্যাক্ট হিসেবে জমা রাখে।
# ডাউনলোড: রানের পাতার নিচে "Artifacts" অংশ থেকে (বিস্তারিত README.md-তে)।

name: Render Story Video

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      formats:
        description: "কোন ফরম্যাট রেন্ডার হবে"
        type: choice
        default: both
        options:
          - both
          - hd
          - 4k
      frame_range:
        description: "ঐচ্ছিক: শুধু কিছু ফ্রেম রেন্ডার (যেমন 0-90 = প্রথম ৩ সেকেন্ড)। ফাঁকা = পুরো ভিডিও (০–২১৩৮)"
        type: string
        default: ""
      hyperframes:
        description: "ঐচ্ছিক ও অযাচাইকৃত: hyperframes.html থেকে আলাদা ক্যাপশন-ওভারলে রেন্ডারের চেষ্টা (ব্যর্থ হলে মূল ভিডিওতে প্রভাব নেই)"
        type: boolean
        default: false

# একই branch-এ নতুন push এলে আগের চলমান রেন্ডার বাতিল (সময় বাঁচে)
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: Render ${{ matrix.format }}
    runs-on: ubuntu-24.04
    # 4K-র জন্য বড় টাইমআউট (GitHub-hosted runner-এর সর্বোচ্চ ৩৬০ মিনিট)
    timeout-minutes: ${{ matrix.format == '4k' && 350 || 120 }}
    strategy:
      fail-fast: false   # একটি ব্যর্থ হলেও অন্যটি চলবে
      matrix:
        format: ${{ fromJSON(inputs.formats == 'hd' && '["hd"]' || inputs.formats == '4k' && '["4k"]' || '["hd","4k"]') }}

    steps:
      - name: কোড নামানো
        uses: actions/checkout@v4

      - name: Node ইনস্টল
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # package-lock.json না থাকায় setup-node-এর ক্যাশ চলে না; তাই নিজে ~/.npm ও Remotion-এর Chrome ক্যাশ করা
      - name: ক্যাশ (npm + Remotion-এর Chrome)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules/.remotion
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package.json') }}
          restore-keys: |
            deps-${{ runner.os }}-node20-

      - name: Chromium-এর সিস্টেম নির্ভরতা
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 \
            libasound2t64 || sudo apt-get install -y libasound2
          # (উপরের সারিতে libasound2t64 না পেলে পুরনো নাম libasound2 চেষ্টা করে)

      - name: প্যাকেজ ইনস্টল
        run: npm install --no-audit --no-fund

      - name: রেন্ডার (${{ matrix.format }})
        env:
          FRAME_RANGE: ${{ inputs.frame_range }}
          # matrix-এর include ব্যবহার করা হয়নি (ফরম্যাট বেছে নিলে বাড়তি জব তৈরি হত); তাই মান এখানেই ঠিক হয়
          COMPOSITION: ${{ matrix.format == '4k' && 'Story-4K' || 'Story-HD' }}
          OUT_FILE: ${{ matrix.format == '4k' && 'out-4k.mp4' || 'out-hd.mp4' }}
          # 4K-তে কম কনকারেন্সি (১): মেমোরি ও 3D (CPU) রেন্ডার সামলাতে; HD-তে ২
          CONCURRENCY: ${{ matrix.format == '4k' && 1 || 2 }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${FRAME_RANGE}" ]; then
            if [[ ! "${FRAME_RANGE}" =~ ^[0-9]+(-[0-9]+)?$ ]]; then
              echo "frame_range ভুল: '${FRAME_RANGE}' — ০-৯০ বা ১২০ এর মতো লিখুন (শুধু সংখ্যা ও একটি ড্যাশ)"; exit 1
            fi
            EXTRA+=("--frames=${FRAME_RANGE}")
            echo "শুধু ফ্রেম ${FRAME_RANGE} রেন্ডার হচ্ছে"
          fi
          npx remotion render index.ts "${COMPOSITION}" "${OUT_FILE}" --concurrency="${CONCURRENCY}" "${EXTRA[@]}"
          ls -lh "${OUT_FILE}"
          {
            echo "### ${COMPOSITION} ✅"
            echo "ফাইল: \`${OUT_FILE}\` — $(du -h "${OUT_FILE}" | cut -f1)"
            [ -n "${FRAME_RANGE}" ] && echo "ফ্রেম-সীমা: ${FRAME_RANGE} (পুরো ভিডিও নয়)"
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: ফলাফল আর্টিফ্যাক্ট হিসেবে জমা
        uses: actions/upload-artifact@v4
        with:
          name: story-${{ matrix.format }}
          path: ${{ matrix.format == '4k' && 'out-4k.mp4' || 'out-hd.mp4' }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0   # MP4 আগে থেকেই সংকুচিত; আবার জিপ করে সময় নষ্ট নয়

  # ঐচ্ছিক ও অযাচাইকৃত: Hyperframes দিয়ে ক্যাপশন-ওভারলে। ডিফল্টে বন্ধ; ব্যর্থ হলে ওপরের মূল রেন্ডারের কিছু যায় আসে না।
  # Hyperframes-এর আসল কমান্ড/ফ্ল্যাগ ইন্টারনেট ছাড়া যাচাই করা যায়নি — ব্যর্থ হলে লগ দিন, ঠিক করে দেব।
  overlay:
    name: Hyperframes ওভারলে (ঐচ্ছিক)
    if: ${{ inputs.hyperframes == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hyperframes রেন্ডার (অযাচাইকৃত কমান্ড)
        run: npx --yes hyperframes render hyperframes.html -o captions-overlay.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: captions-overlay
          path: captions-overlay*
          if-no-files-found: warn
          retention-days: 14
